packages:
  - apps/*
  - packages/*
  - e2e
# Build scripts stay off: esbuild ships prebuilt binaries, and the rest are optional native
# accelerators pulled in by testcontainers and bullmq (see docs/DECISIONS.md D-057).
allowBuilds:
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
# Security overrides: force patched versions of vulnerable transitive dependencies. Remove an entry
# once every package that pulls it in requires a patched version on its own (see docs/DECISIONS.md).
overrides:
  # GHSA-68fv-2mgg-jv7q (high): reached only through build and test tooling (vite > postcss, vitest coverage).
  source-map-js@<1.2.2: ^1.2.2
