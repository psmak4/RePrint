# Job names are the required status checks for `main`. Keep them stable and in sync with docs/ci.md.
# Jobs run on GitHub-hosted runners (D-119). The repo is public while the app is being built, so standard
# runners are free. Fallback when minutes are limited again: the self-hosted runner in docs/ci-runner.md
# (only while the repo is private; never use a self-hosted runner on a public repo).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Turborepo remote cache. When the secret/variable are absent, these are empty and Turbo uses its local cache only.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Biome lint and format check
        run: pnpm exec biome ci .
      - name: Source vocabulary check
        run: pnpm vocabulary:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  db-check:
    name: db-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm db:check

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm openapi:check

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/gitleaks.sh

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm audit:deps

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # An isolated stack (D-113): its own Compose project and shifted ports. Harmless on GitHub-hosted
    # runners, and it keeps the job safe on a shared machine if the self-hosted fallback is used.
    env:
      COMPOSE: docker compose -p reprint-ci -f docker-compose.yml -f docker-compose.ci.yml
      DATABASE_URL: postgres://reprint:reprint@localhost:15432/reprint
      REDIS_URL: redis://localhost:16379
      SMTP_PORT: "11025"
      MAILPIT_API_URL: http://localhost:18025
      E2E_WEB_ORIGIN: http://www.reprint.localhost:15173
      E2E_API_ORIGIN: http://api.reprint.localhost:13000
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Start Postgres, Redis, and Mailpit (fresh CI stack)
        run: |
          $COMPOSE down -v --remove-orphans
          $COMPOSE up -d --wait
      - run: pnpm build
      - name: Migrate the database
        run: pnpm db:migrate
      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove the CI stack
        if: ${{ always() }}
        run: $COMPOSE down -v --remove-orphans
